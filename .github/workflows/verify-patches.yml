# PR/push gate: build the patch overlay against the pinned PICOLIMBO_REF.
# This catches patch-application breakage and compile errors at PR time,
# before they hit master. On master pushes, the resulting image is also
# published to ghcr.io/wynncraft-veterans/auth-stack so the production VPS
# pulls a prebuilt image instead of compiling Rust on a 2GB box.
#
# Image tag = the Dockerfile's ARG PICOLIMBO_REF default, with `+` replaced
# by `-` (OCI tags can't contain `+`). Mutable: each master push re-tags
# the same `:<sanitized-ref>` so Watchtower on the VPS picks it up at 04:00.
name: verify-patches

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag from Dockerfile default
        id: tag
        run: |
          ref=$(awk -F'=' '/^ARG PICOLIMBO_REF=/{print $2; exit}' docker/Dockerfile)
          tag=${ref//+/-}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
          tags: ghcr.io/wynncraft-veterans/auth-stack:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
